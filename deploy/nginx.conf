# Configuração de exemplo para VPS com Nginx (HostGator VPS ou similar)
# 1. Copie para /etc/nginx/sites-available/paitiago
# 2. Ajuste o server_name e o root (caminho onde o build foi enviado)
# 3. ln -s /etc/nginx/sites-available/paitiago /etc/nginx/sites-enabled/
# 4. nginx -t && systemctl reload nginx
# 5. SSL: certbot --nginx -d seudominio.com.br -d www.seudominio.com.br

server {
    listen 80;
    listen [::]:80;
    server_name seudominio.com.br www.seudominio.com.br;

    root /var/www/paitiago/dist;
    index index.html;

    # Rotas do React (SPA) — tudo cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos com hash no nome: cache longo
    location ~* \.(js|css|jpg|jpeg|png|webp|svg|ico|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML sempre atualizado
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    client_max_body_size 10m;
}
